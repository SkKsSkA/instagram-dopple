<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Instagram — clone</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<svg class="icon-sprite" aria-hidden="true">
  <symbol id="icon-home" viewBox="0 0 24 24"><path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></symbol>
  <symbol id="icon-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m16.5 16.5 4 4"/></symbol>
  <symbol id="icon-explore" viewBox="0 0 24 24"><path d="m5 4 15 2-2 15-15-2z"/><path d="m9 15 2-5 5-2-2 5z"/></symbol>
  <symbol id="icon-reels" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M3 9h18M8 4l3 5m2-5 3 5"/><path d="m10 12 5 3-5 3z"/></symbol>
  <symbol id="icon-message" viewBox="0 0 24 24"><path d="m21 3-8.5 18-3.2-7.3L2 10.5z"/><path d="M9.3 13.7 21 3"/></symbol>
  <symbol id="icon-heart" viewBox="0 0 24 24"><path d="M20.8 8.8c0 5.5-8.8 11-8.8 11s-8.8-5.5-8.8-11A4.8 4.8 0 0 1 12 6.2a4.8 4.8 0 0 1 8.8 2.6z"/></symbol>
  <symbol id="icon-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
  <symbol id="icon-menu" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></symbol>
  <symbol id="icon-grid" viewBox="0 0 24 24"><rect x="4" y="4" width="6" height="6"/><rect x="14" y="4" width="6" height="6"/><rect x="4" y="14" width="6" height="6"/><rect x="14" y="14" width="6" height="6"/></symbol>
  <symbol id="icon-bookmark" viewBox="0 0 24 24"><path d="M6 4a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v18l-6-4-6 4z"/></symbol>
  <symbol id="icon-comment" viewBox="0 0 24 24"><path d="M20 11.5a8 8 0 0 1-8 8 8.8 8.8 0 0 1-3.7-.8L4 20l1.3-3.8A8 8 0 1 1 20 11.5z"/></symbol>
  <symbol id="icon-send" viewBox="0 0 24 24"><path d="m21 3-8.5 18-3.2-7.3L2 10.5z"/></symbol>
  <symbol id="icon-tagged" viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.5"/><path d="M5 20a7 7 0 0 1 14 0M4 4h4M4 4v4M20 4h-4M20 4v4"/></symbol>
</svg>
<div class="app">

  <aside class="sidebar">
    <div class="brand"><span class="brand-mark" aria-hidden="true"></span><span class="label">Instagram</span></div>
    <nav class="side-nav">
      <button class="nav-item active" data-route="home" title="Главная">
        <svg class="ico svg-icon"><use href="#icon-home"></use></svg><span class="label">Главная</span>
      </button>
      <button class="nav-item" data-action="search" title="Поиск">
        <svg class="ico svg-icon"><use href="#icon-search"></use></svg><span class="label">Поиск</span>
      </button>
      <button class="nav-item" data-action="explore" title="Интересное">
        <svg class="ico svg-icon accent-icon"><use href="#icon-explore"></use></svg><span class="label">Интересное</span>
      </button>
      <button class="nav-item" data-action="reels" title="Reels">
        <svg class="ico svg-icon accent-icon"><use href="#icon-reels"></use></svg><span class="label">Reels</span>
      </button>
      <button class="nav-item" data-action="messages" title="Сообщения">
        <svg class="ico svg-icon"><use href="#icon-message"></use></svg><span class="label">Сообщения</span><b class="badge">2</b>
      </button>
      <button class="nav-item" data-action="notifications" title="Уведомления">
        <svg class="ico svg-icon accent-icon"><use href="#icon-heart"></use></svg><span class="label">Уведомления</span>
      </button>
      <button class="nav-item" data-action="create" title="Создать">
        <svg class="ico svg-icon accent-icon"><use href="#icon-plus"></use></svg><span class="label">Создать</span>
      </button>
      <button class="nav-item" data-route="profile" title="Профиль">
        <img class="nav-avatar" src="assets/avatar.jpg" alt=""><span class="label">Профиль</span>
      </button>
    </nav>
    <button class="nav-item more-btn" data-action="more" title="Ещё">
      <svg class="ico svg-icon"><use href="#icon-menu"></use></svg><span class="label">Ещё</span>
    </button>
  </aside>

  <header class="mobile-header">
    <button class="mobile-brand" data-route="home"><span class="brand-mark" aria-hidden="true"></span>Instagram</button>
    <div class="mobile-head-actions">
      <button data-action="notifications" aria-label="Уведомления"><svg class="svg-icon"><use href="#icon-heart"></use></svg></button>
      <button data-action="messages" aria-label="Сообщения"><svg class="svg-icon accent-icon"><use href="#icon-message"></use></svg></button>
    </div>
  </header>

  <main id="homePage" class="page">
    <div class="content">
      <section class="stories">
        <button class="story your-story" data-route="profile">
          <span class="story-ring"><img src="assets/avatar.jpg" alt=""></span>
          <span>Ваша история</span>
        </button>
        <button class="story"><span class="story-ring"><img data-gen="alex" alt=""></span><span>alex</span></button>
        <button class="story"><span class="story-ring"><img data-gen="mira" alt=""></span><span>mira</span></button>
        <button class="story"><span class="story-ring"><img data-gen="nova" alt=""></span><span>nova</span></button>
        <button class="story"><span class="story-ring"><img data-gen="dan" alt=""></span><span>dan</span></button>
        <button class="story"><span class="story-ring"><img data-gen="sofia" alt=""></span><span>sofia</span></button>
      </section>

      <section id="feed" class="feed"></section>
    </div>

    <aside class="right-column">
      <div class="account-row">
        <button class="mini-avatar" data-route="profile"><img src="assets/avatar.jpg" alt=""></button>
        <div class="account-info"><strong>ozimandiius</strong><span>Отар Асланбек</span></div>
      </div>
      <div class="suggestions-title"><strong>Рекомендации для вас</strong><button data-action="explore">Все</button></div>
      <div id="suggestions"></div>
      <p class="footer-links">Информация · Помощь · Пресса · API · Вакансии · Конфиденциальность · Условия</p>
      <p class="copyright">© 2026 Instagram from Meta</p>
    </aside>
  </main>

  <main id="profilePage" class="page hidden">
    <div class="profile-content">
      <section class="profile-header">
        <div class="big-avatar"><img id="profileAvatar" src="assets/avatar.jpg" alt="Аватар"></div>
        <div class="profile-details">
          <div class="profile-line">
            <h1>ozimandiius</h1>
            <button class="profile-btn" id="editProfile">Редактировать профиль</button>
            <button class="profile-btn" id="shareProfile">Поделиться профилем</button>
          </div>
          <div class="profile-stats">
            <span><b id="postCount">3</b> публикаций</span>
            <span><b>10</b> подписчиков</span>
            <span><b>9</b> подписок</span>
          </div>
          <div class="profile-bio"><b>Отар Асланбек</b><br>IT • gaming • just vibing<br>📍 Almaty</div>
        </div>
      </section>

      <div class="profile-tabs">
        <button class="profile-tab active" data-tab="posts" aria-label="Публикации" title="Публикации"><svg class="svg-icon"><use href="#icon-grid"></use></svg></button>
        <button class="profile-tab reels-tab" data-tab="reels" aria-label="Reels" title="Reels"><svg class="svg-icon"><use href="#icon-reels"></use></svg></button>
        <button class="profile-tab tagged-tab" data-tab="tagged" aria-label="Отметки" title="Отметки"><svg class="svg-icon"><use href="#icon-tagged"></use></svg></button>
      </div>
      <section id="profileGrid" class="profile-grid"></section>
    </div>
  </main>

  <nav class="mobile-nav">
    <button class="mobile-nav-btn active" data-route="home" aria-label="Главная"><svg class="svg-icon"><use href="#icon-home"></use></svg></button>
    <button class="mobile-nav-btn" data-action="explore" aria-label="Интересное"><svg class="svg-icon accent-icon"><use href="#icon-explore"></use></svg></button>
    <button class="mobile-nav-btn" data-action="reels" aria-label="Reels"><svg class="svg-icon accent-icon"><use href="#icon-reels"></use></svg></button>
    <button class="mobile-nav-btn" data-action="create" aria-label="Создать"><svg class="svg-icon accent-icon"><use href="#icon-plus"></use></svg></button>
    <button class="mobile-nav-btn profile-mobile" data-route="profile" aria-label="Профиль"><img src="assets/avatar.jpg" alt=""></button>
  </nav>
</div>

<div id="toast" class="toast"></div>

<div id="viewer" class="viewer hidden">
  <button class="viewer-close" id="viewerClose">×</button>
  <button class="viewer-arrow left" id="viewerPrev">‹</button>
  <div class="viewer-card">
    <div id="viewerMedia" class="viewer-media"></div>
    <div class="viewer-side">
      <div class="viewer-user"><img id="viewerAvatar" src="assets/avatar.jpg"><b id="viewerUser">ozimandiius</b></div>
      <div id="viewerCaption" class="viewer-caption"></div>
      <div id="viewerComments" class="viewer-comments"></div>
      <div class="viewer-actions"><button id="viewerLike"><svg class="svg-icon"><use href="#icon-heart"></use></svg></button><button><svg class="svg-icon"><use href="#icon-comment"></use></svg></button><button><svg class="svg-icon accent-icon"><use href="#icon-send"></use></svg></button><button class="save"><svg class="svg-icon"><use href="#icon-bookmark"></use></svg></button></div>
      <b id="viewerLikes" class="viewer-likes"></b>
      <form id="commentForm" class="comment-form"><input id="commentInput" placeholder="Добавьте комментарий..."><button>Опубликовать</button></form>
    </div>
  </div>
  <button class="viewer-arrow right" id="viewerNext">›</button>
</div>

<script src="script.js"></script>
</body>
</html>
